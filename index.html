<!DOCTYPE html>
<html>
  <head>
    <title>
      Multi-games
    </title>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
  <div class="noise-overlay" aria-hidden="true"></div>

  <h1>The Perfect Arcade</h1>
  <hr>
  <br>
  
  <div class="game-1-container">
    <h1>Heads or Tails</h1>
    <h4>Rules: Try to guess the same as the computer</h4>
    <div class="coins-container">
    <button class="heads" onclick="playerMove('heads')"><img class="coin" src="./games-pic/heads.png"></button>
    <button class="tails" onclick="playerMove('tails')"><img class="coin" src="./games-pic/tails.png"></button>
    </div>
    <div class="results-container">
    <p class="result"></p>
    <p class="score"></p>
    </div>
  </div>


    <div class="game-2-container">
    <h1>Rock paper scissors</h1>
    <h4>Rock beats scissors, scissors beat paper, and paper beats rock. You just gotta win against a bot</h4>
    <div class="buttons-container">
      <button class="rock" onclick="playerChoice('rock')">Rock</button>
      <button class="paper" onclick="playerChoice('paper')">Paper</button>
      <button class="scissors" onclick="playerChoice('scissors')">Scissors</button>
    </div>
    <div class="results-container">
    <p class="game-2-result"></p>
    <p class="score"></p>
    </div>
  </div>

  <script src="index.js">
  </script>



  </body>

</html>
