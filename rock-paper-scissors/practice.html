<!DOCTYPE html>
<html>
  <head>
    <title>Multi-games-thing</title>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <div class="game-1-container">
     <div class="emoji-container">
       <button class="emoji-button" onclick="playGame('rock')"><img src="./games-pic/rock-emoji.png" class="emoji"></button>

       <button class="emoji-button" onclick="playGame('paper')"><img src="./games-pic/paper-emoji.png" class="emoji"></button>

       <button class="emoji-button" onclick="playGame('scissors')"><img src="./games-pic/scissors-emoji.png" class="emoji"></button>
     </div>
     <p class="result"></p>
     <p class="move"></p>
     <p class="score"></p>

     <button class="reset-button" onclick="score = {wins: 0, losses: 0, ties: 0}; document.querySelector('.result').innerHTML = ''; document.querySelector('.move').innerHTML = ''; document.querySelector('.score').innerHTML = ''; ">Reset Score</button>
    </div>
  </body>

  <script>
  let score = {
    wins: 0,
    losses: 0,
    ties: 0
  };


   function playGame(playerMove) {
      const computerMove = pickComputerMove();
      let result = '';

      if (playerMove === computerMove) {
        result = 'Tie';
      } else if (
        playerMove === 'rock' && computerMove === 'scissors'
      ) {
        result = 'You win!';
      }

      if (playerMove === computerMove) {
        result = 'Tie';
      } else if (
        playerMove === 'rock' && computerMove === 'paper'
      ) {
        result = 'You lose';
      }


      if (playerMove === computerMove) {
        result = 'Tie';
      } else if (
        playerMove === 'paper' && computerMove === 'rock'
      ) {
        result = 'You win!';
      } else if (
        playerMove === 'paper' && computerMove === 'scissors'
      ) {
        result = 'You lose';
      }

      if (playerMove === computerMove) {
        result = 'Tie';
      } else if (
        playerMove === 'scissors' && computerMove === 'paper'
      ) {
        result = 'You win!';
      }  else if (
        playerMove === 'scissors' && computerMove === 'rock'
      ) {
        result = 'You lose';
      }

      if (result === 'You win!') {
        score.wins++;
      } else if (result === 'You lose') {
        score.losses++;
      } else {
        score.ties++;
      }

      document.querySelector('.result').innerHTML = `Result: ${result}`;
      document.querySelector('.move').innerHTML = `You: <img src="./games-pic/${playerMove}-emoji.png" class="emoji"> : <img src="./games-pic/${computerMove}-emoji.png" class="emoji">`;
      document.querySelector('.score').innerHTML = `Score: Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
    }
    
    function pickComputerMove() {
      const randomNumber = Math.random();
      let computerMove = '';

      if (randomNumber < 1 / 3) {
        computerMove = 'rock';
      } else if (randomNumber < 2 / 3) {
        computerMove = 'paper';
      } else {
        computerMove = 'scissors';
      }
      return computerMove;
    }
 



  </script>

</html>
